<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Dashboard</title><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>Academic Records Dashboard</h1><nav><a href="/admin">Admin</a><a href="/settings">API Settings</a><a href="/dashboard">Dashboard</a></nav></header>
<main><section class="card"><h2>Load My Records (Student)</h2><p class="small">Uses /api/student/me and /api/student/marks. A student key only returns records belonging to its owner.</p><button onclick="studentInfo()">My Information</button><button onclick="studentMarks()">My Marks</button><div id="studentOutput" class="message">Choose an action.</div></section>
<section class="card"><h2>Load All Student Marks (Teacher)</h2><p class="small">Uses /api/teacher/students. Requires a teacher API key.</p><button onclick="teacherRecords()">Load All Student Records</button><div id="teacherOutput" class="table-wrap"></div></section></main>
<script>
function key(){return localStorage.getItem('universityApiKey')||'';}
async function callApi(url){if(!key())throw new Error('No API key saved. Open API Settings first.');const r=await fetch(url,{headers:{'x-api-key':key()}});const d=await r.json();if(!r.ok)throw new Error('HTTP '+r.status+': '+(d.message||'Request failed'));return d;}
async function studentInfo(){try{document.getElementById('studentOutput').textContent=JSON.stringify(await callApi('/api/student/me'),null,2);}catch(e){document.getElementById('studentOutput').textContent=e.message;}}
async function studentMarks(){try{document.getElementById('studentOutput').textContent=JSON.stringify(await callApi('/api/student/marks'),null,2);}catch(e){document.getElementById('studentOutput').textContent=e.message;}}
async function teacherRecords(){const out=document.getElementById('teacherOutput');try{let rows=await callApi('/api/teacher/students');if(!rows.length){out.textContent='No records found.';return;}let html='<table><tr><th>Roll No</th><th>Name</th><th>Department</th><th>Semester</th><th>Subject</th><th>Marks</th><th>Total</th></tr>';rows.forEach(r=>html+='<tr><td>'+r.roll_no+'</td><td>'+r.full_name+'</td><td>'+r.department+'</td><td>'+r.semester+'</td><td>'+(r.subject||'')+'</td><td>'+(r.marks_obtained??'')+'</td><td>'+(r.total_marks??'')+'</td></tr>');out.innerHTML=html+'</table>';}catch(e){out.textContent=e.message;}}
</script></body></html>
